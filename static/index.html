<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Assistant</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="page">
    <div class="app">
      <header class="app-header">
        <div class="app-header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <path d="M12 3L13.8 9.2L20 11L13.8 12.8L12 19L10.2 12.8L4 11L10.2 9.2L12 3Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="app-header-text">
          <h1>Personal Assistant</h1>
          <div class="capabilities">
            <span class="chip">📧 Email</span>
            <span class="chip">📅 Calendar</span>
            <span class="chip">☀️ Weather</span>
            <span class="chip">🔎 Search</span>
          </div>
        </div>
      </header>

      <main id="messages" class="messages" aria-live="polite">
        <div class="message assistant">
          <div class="avatar assistant-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
              <path d="M12 3L13.8 9.2L20 11L13.8 12.8L12 19L10.2 12.8L4 11L10.2 9.2L12 3Z" fill="currentColor"/>
            </svg>
          </div>
          <div class="bubble">
            Hi! Ask me about your email, calendar, the weather, or anything you'd like to search the web for.
          </div>
        </div>
      </main>

      <form id="chat-form" class="chat-form">
        <input
          id="chat-input"
          type="text"
          placeholder="Type your request..."
          autocomplete="off"
          autofocus
        />
        <button type="submit" id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="currentColor" fill-opacity="0.15"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
